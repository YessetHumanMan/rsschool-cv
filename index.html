<body>
  <header class="header">
    <div class="container">
      <nav class="menu">
        <a class="logo" href="#body">
          <img src="images/logo-rs.jpg" alt="logo" class="logo-img">

            </li>
            <li class="skills__item">

            </li>
            <li class="skills__item">

  <footer id="contacts" class="contacts">

      <p class="contacts__text">You can contact me via email or phone:</p>
